name: Trivy Vulnerability Scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  trivy:
    name: Run Trivy Scan
    runs-on: ubuntu-latest

  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Docker Builds
      uses: docker/setup-buildx-actions@v3

    - name: Build Docker Image
      run: docker build -t vote:test .

    - name: Run Trivy Scan
      uses: aquasecuirty/trivy-action@master
      with:
        image-ref: "vote:test"
        format: "table"
        exit-code: "0"
        severity: "CRITICAL,HIGH"
